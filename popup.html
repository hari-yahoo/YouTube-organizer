<!DOCTYPE html>
<html>
  <head>
    <style>
      body { width: 300px; font-family: Arial, sans-serif; margin: 0; padding: 12px; background: #f9f9f9; }
      h3 { margin-top: 0; font-size: 16px; color: #202124; }
      select { box-sizing: border-box; width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; background: white; }
      button { width: 100%; background: #cc0000; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
      button:hover { background: #b30000; }
      #categoryTabs { display: flex; gap: 4px; margin-bottom: 8px; }
      .category-tab { flex: 1; margin: 0; padding: 8px 4px; background: #eee; color: #444; font-size: 11px; }
      .category-tab:hover { background: #ddd; }
      .category-tab[aria-selected="true"] { background: #065fd4; color: white; }
      #videoList { max-height: 250px; overflow-y: auto; background: white; border: 1px solid #e0e0e0; border-radius: 4px; padding: 6px; }
      .video-item { display: flex; align-items: flex-start; padding: 6px; border-bottom: 1px solid #eee; font-size: 12px; }
      .video-item:last-child { border-bottom: none; }
      .video-item a { color: #065fd4; text-decoration: none; }
      .video-item a:hover { text-decoration: underline; }
      .video-details { min-width: 0; flex: 1; overflow-wrap: anywhere; }
      .delete-btn { width: 24px; height: 24px; flex-shrink: 0; margin: 0 0 0 8px; padding: 0; background: #f1f1f1; color: #333; font-size: 16px; line-height: 1; }
      .delete-btn:hover { background: #e0e0e0; }
      .category { display: inline-block; margin-top: 4px; padding: 2px 6px; border-radius: 10px; background: #eee; color: #444; font-size: 10px; }
      .empty { color: #666; font-style: italic; text-align: center; padding: 15px; }
    </style>
  </head>
  <body>
    <h3>Watch Later</h3>
    <select id="categorySelect" aria-label="Video category" required>
      <option value="" selected disabled>Select a category</option>
      <option value="Tech">Tech</option>
      <option value="Agri">Agri</option>
      <option value="Others">Others</option>
    </select>
    <button id="saveBtn">Add to list</button>
    <div id="categoryTabs" role="tablist" aria-label="Filter saved videos">
      <button class="category-tab" type="button" role="tab" data-category="All" aria-selected="true">All</button>
      <button class="category-tab" type="button" role="tab" data-category="Tech" aria-selected="false">Tech</button>
      <button class="category-tab" type="button" role="tab" data-category="Agri" aria-selected="false">Agri</button>
      <button class="category-tab" type="button" role="tab" data-category="Others" aria-selected="false">Others</button>
    </div>
    <div id="videoList">
      <div class="empty">No saved videos yet.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
