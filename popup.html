<!DOCTYPE html>
<html>
  <head>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #202124; background: #f5f6f8; }
      * { box-sizing: border-box; }
      body { width: 380px; max-height: 600px; display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 16px; overflow: hidden; }
      h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
      button, input, select { font: inherit; }
      select, input { min-width: 0; height: 36px; padding: 0 10px; border: 1px solid #d7dbe0; border-radius: 8px; background: #fff; color: #202124; font-size: 12px; }
      select:focus, input:focus { outline: 2px solid #a8c7fa; outline-offset: 1px; border-color: #4285f4; }
      #saveControls { display: flex; gap: 8px; }
      #categorySelect { flex: 1; }
      button { border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 120ms ease, transform 120ms ease; }
      button:focus-visible { outline: 2px solid #4285f4; outline-offset: 2px; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #saveBtn { width: auto; min-width: 108px; height: 36px; margin: 0; padding: 0 14px; background: #c5221f; color: #fff; font-size: 12px; }
      #saveBtn:hover { background: #a50e0e; }
      #categoryManager { padding: 8px 10px; border: 1px solid #e0e3e7; border-radius: 9px; background: #fff; }
      #categoryManager summary { color: #555b63; cursor: pointer; font-size: 11px; font-weight: 600; user-select: none; }
      #categoryForm { display: flex; gap: 6px; margin-top: 8px; }
      #categoryName { flex: 1; height: 32px; }
      #addCategoryBtn { width: auto; margin: 0; padding: 0 12px; background: #eef3fd; color: #174ea6; font-size: 11px; }
      #addCategoryBtn:hover { background: #dce8fc; }
      #categoryList { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
      .category-chip { display: flex; align-items: center; gap: 4px; padding: 3px 5px 3px 8px; border-radius: 12px; background: #f1f3f4; color: #444; font-size: 10px; }
      .remove-category-btn { width: auto; margin: 0; padding: 0 3px; background: transparent; color: #666; font-size: 13px; line-height: 1; }
      .remove-category-btn:hover { color: #c5221f; }
      #searchPanel { padding: 8px 10px; border: 1px solid #e0e3e7; border-radius: 9px; background: #fff; }
      #searchPanel summary { color: #555b63; cursor: pointer; font-size: 11px; font-weight: 600; user-select: none; }
      #searchOptions { display: grid; gap: 7px; margin-top: 8px; }
      #searchControls { display: flex; gap: 7px; }
      #searchInput { flex: 1; }
      #searchField { width: 112px; flex-shrink: 0; }
      #statusFilter { width: 100%; }
      #videoList { min-height: 110px; flex: 1; overflow-y: auto; overscroll-behavior: contain; border: 1px solid #e0e3e7; border-radius: 10px; background: #fff; }
      .video-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-bottom: 1px solid #eef0f2; }
      .video-item:last-child { border-bottom: 0; }
      .video-item a { color: #174ea6; font-size: 12px; font-weight: 600; line-height: 1.4; text-decoration: none; }
      .video-item a:hover { text-decoration: underline; }
      .video-details { min-width: 0; flex: 1; overflow-wrap: anywhere; }
      .video-thumbnail { width: 96px; height: 54px; flex-shrink: 0; object-fit: cover; border-radius: 6px; background: #eef0f2; }
      .video-metadata { margin-top: 3px; color: #70757a; font-size: 10px; }
      .video-status { display: inline-block; margin-top: 6px; padding: 3px 7px; border-radius: 10px; background: #fef7e0; color: #8a5b00; font-size: 10px; }
      .video-status.watched { background: #e6f4ea; color: #137333; }
      .status-toggle { width: auto; margin: 6px 0 0 5px; padding: 4px 7px; background: #f1f3f4; color: #444; font-size: 10px; }
      .status-toggle:hover { background: #e8eaed; }
      .delete-btn { width: 26px; height: 26px; flex-shrink: 0; margin: -2px -3px 0 0; padding: 0; background: transparent; color: #777; font-size: 16px; line-height: 1; }
      .delete-btn:hover { background: #fce8e6; color: #c5221f; }
      .category { display: inline-block; margin-top: 5px; padding: 3px 7px; border-radius: 10px; background: #f1f3f4; color: #555b63; font-size: 10px; }
      .empty { color: #70757a; font-size: 12px; text-align: center; padding: 30px 14px; }
    </style>
  </head>
  <body>
    <h3>Watch Later</h3>
    <div id="saveControls">
      <select id="categorySelect" aria-label="Video category" required>
        <option value="" selected disabled>Select a category</option>
      </select>
      <button id="saveBtn">Save video</button>
    </div>
    <details id="categoryManager">
      <summary>Manage categories</summary>
      <form id="categoryForm">
        <input id="categoryName" type="text" maxlength="40" placeholder="New category" aria-label="New category name" required>
        <button id="addCategoryBtn" type="submit">Add</button>
      </form>
      <div id="categoryList" aria-label="Categories"></div>
    </details>
    <details id="searchPanel">
      <summary>Search and filters</summary>
      <div id="searchOptions">
        <div id="searchControls">
          <input id="searchInput" type="search" placeholder="Search saved videos" aria-label="Search saved videos">
          <select id="searchField" aria-label="Search within">
            <option value="all">All fields</option>
            <option value="title">Title</option>
            <option value="channel">Channel</option>
            <option value="tag">Tag</option>
            <option value="duration">Duration</option>
          </select>
        </div>
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
        <select id="statusFilter" aria-label="Filter by watched status">
          <option value="all">All statuses</option>
          <option value="unwatched">Unwatched</option>
          <option value="watched">Watched</option>
        </select>
      </div>
    </details>
    <div id="videoList">
      <div class="empty">No saved videos yet.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
